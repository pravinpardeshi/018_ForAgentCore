[project]
name = "snow-knowledge-agent"
version = "0.1.0"
description = "ServiceNow closed-incidents Knowledge Agent for AWS Bedrock AgentCore (PostgreSQL + pgvector)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "bedrock-agentcore>=1.19.0",
  "strands-agents>=1.0.0",
  "strands-agents-tools>=1.0.0",
  "boto3>=1.35.0",
  "psycopg[binary,pool]>=3.2.0",
  "pgvector>=0.3.6",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_agent"]

[tool.ruff]
line-length = 100
