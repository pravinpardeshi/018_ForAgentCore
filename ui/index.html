<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ServiceNow Knowledge Agent — Local Test UI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>ServiceNow Knowledge Agent</h1>
    <p class="subtitle">
      Local test console &mdash; <strong>SSO bypassed</strong>. Localhost only, do not expose.
    </p>
  </header>

  <main>
    <section id="settings">
      <div class="field">
        <label for="topk">top_k</label>
        <input id="topk" type="number" min="1" max="20" value="5" />
      </div>
      <div class="field grow">
        <label for="session">session_id</label>
        <input id="session" type="text" readonly />
      </div>
      <button id="newsession" type="button" title="Start a new conversation">New session</button>
      <button id="clear" type="button" title="Clear visible chat (session stays)">Clear</button>
      <span id="agent-status" class="status" title="Where /api/ask forwards to">agent: …</span>
    </section>

    <section id="chat" aria-live="polite"></section>

    <section id="composer">
      <textarea id="prompt" rows="3"
        placeholder="Ask about a past incident, e.g. VPN error 809 on Windows 11 — how was it fixed before?"></textarea>
      <button id="send" type="button">Send</button>
    </section>
    <p class="hint">Enter to send &middot; Shift+Enter for newline. Answers should cite <code>[INCxxxxxxx]</code>.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
